<!DOCTYPE html>
<html lang="{{ language|default:'uz' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ s.login_page_title|default:"Kirish" }}</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236c5cf2'/%3E%3Cstop offset='1' stop-color='%2317b3a3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M32 12v16M32 36v16M12 32h16M36 32h16' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --primary-50: #f1f0ff; --primary-100: #e3e1fe; --primary-500: #6c5cf2; --primary-600: #5540e6; --primary-700: #4530c4;
    --teal-500: #17b3a3; --teal-700: #0c766b;
    --bg: #fbfbfe; --surface: #ffffff; --surface-sunken: #f6f7fb;
    --border: #e2e5ee; --text: #14151f; --text-muted: #6b7290; --text-faint: #9aa1b9; --danger: #e11d48; --danger-bg: #fef2f4;
    --r-sm: 10px; --r-md: 14px; --r-xl: 24px;
    --shadow-sm: 0 2px 6px -2px rgba(20,21,40,.08), 0 1px 2px rgba(20,21,40,.04);
    --shadow-lg: 0 24px 56px -16px rgba(35,30,90,.24), 0 8px 20px -8px rgba(35,30,90,.1);
    --ease: cubic-bezier(.4,0,.2,1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 480px at 10% -10%, var(--primary-50) 0%, transparent 60%),
      radial-gradient(700px 420px at 100% 110%, #eefcfa 0%, transparent 55%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .auth-card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-xl); box-shadow: var(--shadow-lg); padding: 2.4rem 2.1rem;
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 0.9rem; margin-bottom: 1.7rem; text-align: center; }
  .brand-mark {
    display: grid; place-items: center; width: 60px; height: 60px; border-radius: var(--r-md);
    background: linear-gradient(135deg, var(--primary-500), var(--teal-500)); box-shadow: var(--shadow-sm);
  }
  .brand-mark svg { width: 58%; height: 58%; }
  .brand-mark-img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
  .brand-mark.has-image { background: #fff; }
  .brand-name { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; }
  .brand-name small {
    display: block; font-weight: 600; font-size: 0.68rem; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text-muted); margin-top: 0.2rem;
  }
  h1 { font-size: 1.25rem; font-weight: 750; text-align: center; margin: 0 0 0.35rem; }
  .auth-sub { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin: 0 0 1.6rem; }
  label { display: block; margin-top: 1rem; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
  input {
    width: 100%; font: inherit; font-size: 1rem; padding: 0.65rem 0.8rem; margin-top: 0.4rem;
    border: 1.5px solid var(--border); border-radius: var(--r-sm); background: var(--surface-sunken);
    color: var(--text); box-sizing: border-box; transition: border-color .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease);
  }
  input::placeholder { color: var(--text-faint); }
  input:focus { outline: none; border-color: var(--primary-500); box-shadow: 0 0 0 4px var(--primary-100); background: var(--surface); }
  button {
    margin-top: 1.6rem; width: 100%; font: inherit; font-weight: 750; font-size: 1.05rem; padding: 0.8rem;
    background: linear-gradient(135deg, var(--primary-500), var(--primary-700)); color: white;
    border: none; border-radius: var(--r-sm); cursor: pointer; box-shadow: var(--shadow-sm);
    transition: transform .12s var(--ease), box-shadow .12s var(--ease);
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -10px rgba(35,30,90,.28); }
  button:active { transform: translateY(0); }
  .errorlist {
    list-style: none; padding: 0.8rem 1rem; margin: 0 0 1.1rem; color: var(--danger);
    background: var(--danger-bg); border-radius: var(--r-md); font-size: 0.87rem; font-weight: 600;
    border: 1px solid #fbd2da;
  }
  .language-switcher { display: flex; gap: 0.3rem; justify-content: center; margin-bottom: 1.5rem; }
  .language-switcher button {
    margin: 0; width: auto; padding: 0.4rem 0.7rem; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.02em;
    background: var(--surface); color: var(--text-muted); border: 1.5px solid var(--border); box-shadow: none;
  }
  .language-switcher button:hover { background: var(--surface-sunken); box-shadow: none; transform: none; }
  .language-switcher button.active { background: var(--primary-50); color: var(--primary-700); border-color: var(--primary-100); }
</style>
</head>
<body>
<div class="auth-card">
  <div class="language-switcher" role="group" aria-label="Til">
    {% for code in languages %}
    <form method="post" action="{% url 'seller_web:set_language' %}" style="display:contents">
      {% csrf_token %}
      <input type="hidden" name="language" value="{{ code }}">
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button type="submit"{% if code == language %} class="active"{% endif %}>{{ code|upper }}</button>
    </form>
    {% endfor %}
  </div>
  <div class="brand">
    <span class="brand-mark{% if has_platform_logo %} has-image{% endif %}" aria-hidden="true">
      {% if has_platform_logo %}
        <img src="/api/branding/logo/" alt="" class="brand-mark-img">
      {% else %}
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 4v6.5M12 13.5V20M4 12h6.5M13.5 12H20" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
      {% endif %}
    </span>
    <span class="brand-name">{{ platform_name }}<small>{{ s.brand_subtitle }}</small></span>
  </div>
  <h1>{{ s.login_heading }}</h1>
  <p class="auth-sub">{{ s.login_subheading }}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label for="{{ form.username.id_for_label }}">{{ s.login_username }}</label>
    {{ form.username }}
    <label for="{{ form.password.id_for_label }}">{{ s.login_password }}</label>
    {{ form.password }}
    <button type="submit">{{ s.login_submit }}</button>
  </form>
</div>
</body>
</html>

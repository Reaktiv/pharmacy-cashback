<!DOCTYPE html>
<html lang="{{ language|default:'uz' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ s.login_page_title|default:"Kirish" }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236c5cf2'/%3E%3Cstop offset='1' stop-color='%2317b3a3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M32 12v16M32 36v16M12 32h16M36 32h16' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --pharm-bg: #f6f8f5;
    --pharm-surface: #ffffff;
    --pharm-surface-2: #eef3ee;
    --pharm-ink: #14231c;
    --pharm-ink-muted: #5b6b62;
    --pharm-primary: #0f3d2e;
    --pharm-primary-2: #1b5e44;
    --pharm-accent: #2fbf8f;
    --pharm-danger: #c24a3d;
    --pharm-line: #dde5de;
    --ease: cubic-bezier(.4,0,.2,1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: flex;
    font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--pharm-ink); background: var(--pharm-surface);
    -webkit-font-smoothing: antialiased;
  }

  .auth-left {
    flex: 1 1 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.5rem; padding: 3rem 2rem; background: var(--pharm-primary);
  }
  .auth-left-mark { width: 132px; height: 132px; flex-shrink: 0; display: grid; place-items: center; }
  .auth-left-mark img { width: 100%; height: 100%; object-fit: contain; }
  .auth-left-mark svg { width: 100%; height: 100%; }
  .auth-left-brand-text { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; max-width: 320px; }
  .auth-left-name {
    font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; font-weight: 600;
    font-size: 1.3rem; line-height: 1.3; color: #fff; text-align: center;
  }
  .auth-left-subtitle {
    font-size: 0.76rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.65); text-align: center;
  }

  .auth-right {
    flex: 1 1 50%; position: relative; display: flex; align-items: center; justify-content: center;
    padding: 3rem 2rem; background: var(--pharm-surface);
  }
  .auth-form-wrap { width: 100%; max-width: 360px; }
  .auth-form-wrap h1 {
    font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; font-weight: 500;
    font-size: 1.75rem; letter-spacing: -0.01em; color: var(--pharm-ink); margin: 0 0 0.35rem;
  }
  .auth-sub { color: var(--pharm-ink-muted); font-size: 0.875rem; margin: 0 0 1.75rem; }

  label {
    display: block; margin-top: 1rem; font-family: 'Public Sans', sans-serif;
    font-size: 0.82rem; font-weight: 600; color: var(--pharm-ink-muted);
  }
  input {
    width: 100%; font: inherit; font-size: 1rem; padding: 0.7rem 0.9rem; margin-top: 0.4rem;
    border: 1.5px solid var(--pharm-line); border-radius: 10px; background: var(--pharm-surface);
    color: var(--pharm-ink); box-shadow: none; transition: border-color .15s var(--ease);
  }
  input::placeholder { color: #9aa79f; }
  input:hover { border-color: #c7d2c9; }
  input:focus { outline: none; border-color: var(--pharm-primary); box-shadow: none; }

  button[type="submit"] {
    margin-top: 1.6rem; width: 100%; font-family: 'Public Sans', sans-serif; font-weight: 700;
    font-size: 0.95rem; padding: 0.85rem 1.5rem; background: var(--pharm-primary); color: #fff;
    border: none; border-radius: 999px; cursor: pointer; box-shadow: none;
    transition: transform .08s var(--ease), background .15s var(--ease);
  }
  button[type="submit"]:hover { background: var(--pharm-primary-2); }
  button[type="submit"]:active { transform: translateY(2px); }

  .errorlist {
    list-style: none; padding: 0.85rem 1rem; margin: 0 0 1.1rem; color: var(--pharm-danger);
    background: rgba(194, 74, 61, 0.08); border: 1px solid rgba(194, 74, 61, 0.22);
    border-radius: 10px; font-size: 0.87rem; font-weight: 600;
  }

  .lang-dropdown { position: absolute; top: 2rem; right: 2rem; }
  .lang-dropdown-trigger {
    display: inline-flex; align-items: center; gap: 0.4rem; background: var(--pharm-surface);
    color: var(--pharm-ink); border: 1.5px solid var(--pharm-line); border-radius: 10px;
    padding: 0.5rem 0.85rem; font-family: 'Public Sans', sans-serif; font-weight: 700;
    font-size: 0.78rem; cursor: pointer; box-shadow: none;
  }
  .lang-dropdown-trigger:hover { background: var(--pharm-surface-2); }
  .lang-dropdown-chevron { width: 14px; height: 14px; transition: transform .15s var(--ease); }
  .lang-dropdown.open .lang-dropdown-chevron { transform: rotate(180deg); }
  .lang-dropdown-menu {
    position: absolute; top: calc(100% + 0.4rem); right: 0; min-width: 100%;
    background: var(--pharm-surface); border: 1.5px solid var(--pharm-line); border-radius: 10px;
    overflow: hidden; padding: 0.3rem; z-index: 20; display: none;
  }
  .lang-dropdown.open .lang-dropdown-menu { display: block; }
  .lang-dropdown-menu form { margin: 0; }
  /* Two class selectors here so this beats the generic `button[type="submit"]`
     rule above — these options are real submit buttons (each posts its own
     language-switch form), not the plain `type="button"` toggles a JS-driven
     dropdown would use. */
  .lang-dropdown-menu .lang-dropdown-option {
    display: block; width: 100%; text-align: left; background: transparent;
    color: var(--pharm-ink-muted); border: none; border-radius: 7px; padding: 0.45rem 0.6rem;
    font-family: 'Public Sans', sans-serif; font-weight: 600; font-size: 0.78rem; cursor: pointer;
    margin: 0; box-shadow: none;
  }
  .lang-dropdown-menu .lang-dropdown-option:hover { background: var(--pharm-surface-2); }
  .lang-dropdown-menu .lang-dropdown-option.active { color: var(--pharm-primary); background: var(--pharm-surface-2); }

  @media (max-width: 860px) {
    body { flex-direction: column; }
    .auth-left { flex: 0 0 auto; padding: 2.25rem 1.5rem; gap: 1rem; }
    .auth-left-mark { width: 96px; height: 96px; }
    .auth-left-name { font-size: 1.05rem; }
    .auth-right { padding: 2.5rem 1.5rem 3rem; }
    .lang-dropdown { top: 1.25rem; right: 1.25rem; }
  }
</style>
</head>
<body>
<div class="auth-left">
  <span class="auth-left-mark" aria-hidden="true">
    {% if has_platform_logo %}
      <img src="/api/branding/logo/" alt="">
    {% else %}
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="44" stroke="white" stroke-width="5"/>
        <text x="50" y="63" text-anchor="middle" font-family="'Public Sans', sans-serif" font-weight="800" font-size="34" fill="white">PC</text>
      </svg>
    {% endif %}
  </span>
  <div class="auth-left-brand-text">
    <span class="auth-left-name">{{ platform_name }}</span>
    <span class="auth-left-subtitle">{{ s.brand_subtitle }}</span>
  </div>
</div>
<div class="auth-right">
  <div class="lang-dropdown" id="lang-dropdown">
    <button type="button" class="lang-dropdown-trigger" id="lang-dropdown-trigger" aria-haspopup="listbox" aria-expanded="false">
      {{ language|upper }}
      <svg class="lang-dropdown-chevron" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="lang-dropdown-menu" role="listbox">
      {% for code in languages %}
      <form method="post" action="{% url 'seller_web:set_language' %}">
        {% csrf_token %}
        <input type="hidden" name="language" value="{{ code }}">
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit" class="lang-dropdown-option{% if code == language %} active{% endif %}" role="option" aria-selected="{% if code == language %}true{% else %}false{% endif %}">{{ code|upper }}</button>
      </form>
      {% endfor %}
    </div>
  </div>
  <div class="auth-form-wrap">
    <h1>{{ s.login_heading }}</h1>
    <p class="auth-sub">{{ s.login_subheading }}</p>
    {{ form.non_field_errors }}
    <form method="post">
      {% csrf_token %}
      <label for="{{ form.username.id_for_label }}">{{ s.login_username }}</label>
      {{ form.username }}
      <label for="{{ form.password.id_for_label }}">{{ s.login_password }}</label>
      {{ form.password }}
      <button type="submit">{{ s.login_submit }}</button>
    </form>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('lang-dropdown');
  var trigger = document.getElementById('lang-dropdown-trigger');
  trigger.addEventListener('click', function (event) {
    event.stopPropagation();
    var open = root.classList.toggle('open');
    trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', function (event) {
    if (!root.contains(event.target)) {
      root.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
    }
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      root.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>
</body>
</html>

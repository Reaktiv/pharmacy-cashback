# Audit finding M-8: the default json-file log driver has no size cap, so
# container logs (especially `web`'s --access-log, which logs every
# /healthz/ poll) grow unbounded over months. Applied to every service via
# this one anchor so a new service added later doesn't silently miss it.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Plain uvicorn, not `gunicorn -k uvicorn.workers.UvicornWorker` — on
    # this stack, gunicorn==26.0.0's arbiter binds the socket to 127.0.0.1
    # even when passed `-b 0.0.0.0:8000` (verified at the kernel level via
    # /proc/net/tcp: the listening socket's local address was 0100007F,
    # i.e. loopback-only), which nginx in a separate container can never
    # reach. Plain uvicorn with the same --host/--port binds correctly.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000
               --workers 3 --access-log"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # python, not curl — the base image (python:3.11-slim) doesn't have curl
    # installed and this avoids adding it just for a healthcheck.
    # start_period covers the migrate+collectstatic phase above, which the
    # command runs before uvicorn ever starts listening — without it, every
    # (re)start would rack up healthcheck failures before the app is even up.
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz/', timeout=5).status == 200 else 1)"
      ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config worker -l info
    volumes:
      - media:/app/media
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `celery inspect ping` round-trips through the broker to the worker's
    # own event loop, so it only succeeds if the worker is actually
    # processing tasks, not just alive as a process.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -t 10"]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    # Docker only auto-seeds a *newly created, empty* named volume from the
    # image's content at the mount path — on every deploy after the first,
    # frontend-dist already has (now-stale) files in it, so mounting the
    # volume straight over /app/dist would hide each new build behind the
    # very first one forever. Mount it at a different path instead and
    # explicitly replace its contents with this build's output every time.
    command: sh -c "rm -rf /out/* && cp -r /app/dist/. /out/"
    volumes:
      - frontend-dist:/out
    restart: "no"
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - frontend-build
    restart: unless-stopped
    logging: *default-logging

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  media:
  static:
  frontend-dist:

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Test-only values, not real secrets — safe to commit. A real deployment
  # gets its own SECRET_KEY/FERNET_KEY from its own .env (see DEPLOY.md),
  # never from here.
  SECRET_KEY: ci-test-secret-key-not-for-production
  FERNET_KEY: 0zBOh4MovkWYlFwgrZ3bTX_uCW9bAlzGX5wLqqqLz2E=
  DEBUG: "False"
  ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  REDIS_URL: redis://localhost:6379/0

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # libzbar0 is pyzbar's runtime dependency and is not on the runner
      # image. pyzbar dlopen()s libzbar.so.0 at *import* time, so without
      # it every test that touches apps.bot.qr fails on the import line,
      # not on a decode. Same reason backend/Dockerfile installs it.
      - name: Install libzbar0
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzbar0

      # --extra-index-url must match backend/Dockerfile's: requirements.txt
      # pins torch/torchvision to *+cpu* local-version builds, which exist
      # only on download.pytorch.org, never on PyPI. Without this flag pip
      # resolves against PyPI alone and the whole step dies with "No
      # matching distribution found for torch==2.13.0+cpu" before a single
      # test runs.
      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
              -r requirements.txt

      # ultralytics/qrdet/qreader are deliberately absent from
      # requirements.txt and installed with --no-deps instead — see that
      # file's opencv-python-headless comment and backend/Dockerfile for
      # why (all three hard-require the GUI "opencv-python" in their
      # metadata, which corrupts the headless cv2 install). apps/bot/qr.py
      # imports qreader at module level and apps/bot/tests/test_receipt.py
      # runs real decodes, so CI needs them exactly as the image has them.
      - name: Install QR decode stack (--no-deps, mirrors backend/Dockerfile)
        run: pip install --no-deps ultralytics==8.4.123 qrdet==2.5 qreader==3.16

      # Fetches qrdet's YOLO weights up front, the same way the image bakes
      # them in, so a network hiccup shows up here as an infra failure
      # instead of as a confusing mass of "QR not found" test failures.
      - name: Warm qreader model cache
        run: python -c "from qreader import QReader; QReader(model_size='s')"

      # Required gate: the ledger/tenancy/fraud-limit test suite, including
      # the mandatory tenant-isolation test (CLAUDE.md §4), must pass before
      # anything merges to main.
      - name: Run tests
        run: python -m pytest backend -q

      # Required gate: catches real bugs (unused imports, undefined names,
      # bad exception chaining), not just style.
      - name: Lint (ruff)
        run: ruff check backend

      # Required gate: the previous "backlog" of ~141 errors was almost
      # entirely the django-stubs mypy plugin never being registered
      # (pyproject.toml's [tool.mypy] had plugins = []) — with that fixed,
      # the real backlog was 6 genuine errors, now fixed, plus a handful of
      # CheckConstraint(check=...) stub/runtime mismatches that are
      # intentionally silenced with a documented `type: ignore[call-arg]`
      # (django-stubs 6.0.7 expects Django 5.1+'s `condition=` kwarg; the
      # app is pinned to Django 5.0.14, where only `check=` exists).
      - name: Type check (mypy)
        run: mypy backend --config-file pyproject.toml

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Type check + build
        working-directory: frontend
        run: npm run build

# First-boot config, used only to obtain the initial Let's Encrypt
# certificate (no TLS server block yet, since the cert files don't exist
# until certbot runs against this). See DEPLOY.md.
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "bootstrap ok\n";
        add_header Content-Type text/plain;
    }
}

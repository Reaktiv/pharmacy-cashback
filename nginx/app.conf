# Production config — active once the TLS certificate exists
# (/etc/letsencrypt/live/__DOMAIN__/...). See DEPLOY.md.

server {
    listen 80;
    server_name __DOMAIN__;

    # Kept so certbot's renewal (webroot mode) keeps working without
    # taking nginx down.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Broadcast video uploads are capped at 50MB client-side
    # (frontend/src/components/MediaAttach.tsx) — leave headroom.
    client_max_body_size 55m;

    # Django admin's collected static assets (CSS/JS) — CLAUDE.md §4 keeps
    # /media/ off nginx entirely, it's only ever served through the
    # tenant-scoped, authenticated BroadcastMediaFileView, so it is
    # deliberately NOT exposed here — only proxied under /api/ below.
    location /static/ {
        alias /app/staticfiles/;
    }

    location ~ ^/(admin|api|accounts|seller|webhook|healthz)(/|$) {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React admin panel (SPA) — everything else falls through to
    # index.html so client-side routing (react-router) handles the path.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

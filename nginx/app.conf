# Production config — active once the TLS certificate exists
# (/etc/letsencrypt/live/__DOMAIN__/...). See DEPLOY.md.

# The base nginx:alpine image ships gzip commented out. Most of this app's
# real users are pharmacy staff on mobile connections in Uzbekistan, so
# compressing the SPA bundle and proxied API/report JSON matters more here
# than the CPU cost of compressing it. gzip_types deliberately doesn't list
# image/font formats — this app doesn't serve any (icons are SVG, already
# covered; PNGs/JPEGs are already compressed and gzipping them again is
# wasted CPU for no size win).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

server {
    listen 80;
    server_name __DOMAIN__;

    # Kept so certbot's renewal (webroot mode) keeps working without
    # taking nginx down.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Broadcast video uploads are capped at 50MB client-side
    # (frontend/src/components/MediaAttach.tsx) — leave headroom.
    client_max_body_size 55m;

    # Django admin's collected static assets (CSS/JS).
    location /static/ {
        alias /app/staticfiles/;
        # Django's default StaticFilesStorage doesn't content-hash these
        # filenames, so a redeploy can change what's behind the same path —
        # keep this short enough that a browser picks up an upgrade within
        # a day, unlike the immutable long cache below for the SPA bundle.
        # (add_header alone, not the `expires` directive too — `expires`
        # emits its own Cache-Control header, and combining the two would
        # send two Cache-Control headers in the same response.)
        add_header Cache-Control "public, max-age=86400";
    }

    # Broadcast media (images/videos) — CLAUDE.md §4 still keeps this off
    # nginx for *direct* requests: `internal` makes this location
    # unreachable from outside (nginx returns 404 for a request that names
    # it directly), reachable only via an X-Accel-Redirect response from
    # apps.broadcasts.api_views' file actions, which is the tenant-scoped,
    # authenticated check gating access — nginx just streams the bytes
    # afterward, instead of a Django worker process holding a connection
    # open for however long a large video download takes.
    location /internal-media/ {
        internal;
        alias /app/media/;
    }

    location ~ ^/(admin|api|accounts|seller|webhook|healthz)(/|$) {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite content-hashes every bundle filename (assets/index-<hash>.js /
    # .css) — a new deploy always ships new filenames alongside the old
    # ones, so it's always safe to cache these forever.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React admin panel (SPA) — everything else falls through to
    # index.html so client-side routing (react-router) handles the path.
    # index.html itself must never be cached: it's the one file that names
    # the current hashed bundle, so a stale copy would keep pointing at
    # assets a later deploy already removed.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
